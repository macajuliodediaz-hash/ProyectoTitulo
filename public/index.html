<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="ArgusNexus: proyecto de título académico (Analista Programador, Iplacex) con datos ficticios de demostración.">
  <title>Ingreso | ArgusNexus</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="login-pagina">

  <main class="login-tarjeta">
    <header class="marca">
      <h1>ArgusNexus</h1>
      <p>Proyecto de Título · Analista Programador · Iplacex</p>
    </header>

    <div id="mensaje-error" class="mensaje-error" role="alert"></div>

    <form id="form-login" action="/api/login" method="post">
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="username" required>
      </div>

      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" autocomplete="current-password" required>
      </div>

      <button type="submit" class="boton">Ingresar</button>
    </form>

    <p class="pie-login">
      Sistema académico de demostración con datos ficticios.
      Caso de estudio: GEN BackOffice. No ingreses contraseñas personales.
      <br><a href="https://github.com/macajuliodediaz-hash/ProyectoTitulo" target="_blank" rel="noopener">Ver código fuente en GitHub</a>
    </p>
  </main>

  <script src="/js/login.js" defer></script>

</body>
</html>
