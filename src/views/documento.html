<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documento | ArgusNexus</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

  <header class="panel-cabecera">
    <h1 class="panel-marca">ArgusNexus</h1>
    <div class="panel-usuario">
      <span id="usuario-nombre"></span>
      <span id="usuario-rol" class="etiqueta-rol"></span>
      <button type="button" id="boton-salir" class="boton-secundario">Cerrar sesión</button>
    </div>
  </header>

  <nav class="panel-navegacion" id="menu" aria-label="Menú principal"></nav>

  <main class="panel-contenido">
    <div class="encabezado-seccion">
      <a href="/" class="enlace-volver">← Volver al inicio</a>
      <div class="acciones-documento" id="acciones"></div>
    </div>

    <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

    <!-- Estado del documento y, si corresponde, plazo de corrección (RNF7) -->
    <section id="estado-documento" class="tarjeta franja-estado" hidden></section>

    <!-- Panel del Administrador: aprobar, rechazar, habilitar y confidencialidad -->
    <section id="panel-revision" class="tarjeta panel-revision" hidden>
      <h3 class="titulo-bloque">Revisión del administrador</h3>
      <div id="error-revision" class="mensaje-error" role="alert"></div>
      <div class="campo" id="campo-motivo" hidden>
        <label for="motivo">Motivo de la corrección *</label>
        <textarea id="motivo" rows="3" maxlength="255"
                  placeholder="Indica qué debe corregir el autor (se le notificará y quedará en la auditoría)"></textarea>
      </div>
      <div class="acciones-revision" id="acciones-revision"></div>
      <label class="opcion opcion-confidencial">
        <input type="checkbox" id="confidencial"> Documento confidencial (solo visible para Administradores)
      </label>
    </section>

    <div id="hoja"><p class="texto-suave">Cargando documento…</p></div>
  </main>

  <script src="/js/panel.js" defer></script>
  <script src="/js/documento-vista.js" defer></script>
  <script src="/js/documento.js" defer></script>
</body>
</html>
